<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skin URL Generator</title>
  
  <!-- Minecraft Skin 3D viewer kutubxonasi (CDN) -->
  <script src="https://bs-community.github.io/skinview3d/js/skinview3d.bundle.js"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    body {
      background-color: #0d0d0d;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .main-card {
      width: 100%;
      max-width: 420px;
      background: #141414;
      border: 1px solid #262626;
      border-radius: 16px;
      padding: 24px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .title {
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      color: #ff7b00;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Upload Maydoni */
    .upload-zone {
      border: 2px dashed #ff7b00;
      border-radius: 12px;
      padding: 30px 15px;
      text-align: center;
      cursor: pointer;
      background-color: #1a1a1a;
      transition: all 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 200px;
      position: relative;
    }

    .upload-zone:hover {
      background-color: #222222;
      border-color: #ffa200;
    }

    .upload-text {
      font-size: 16px;
      color: #aaaaaa;
      font-weight: 600;
      pointer-events: none;
    }

    #skin-canvas {
      display: none;
      width: 150px;
      height: 180px;
    }

    #file-input {
      display: none;
    }

    /* Generate Tugmasi */
    .btn-generate {
      background: linear-gradient(135deg, #ff7b00, #ff9500);
      border: none;
      padding: 14px;
      border-radius: 10px;
      color: #000000;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      box-shadow: 0 4px 12px rgba(255, 123, 0, 0.2);
    }

    .btn-generate:hover {
      opacity: 0.95;
      transform: translateY(-1px);
    }

    .btn-generate:active {
      transform: translateY(0);
    }

    .btn-generate:disabled {
      background: #333333;
      color: #777777;
      cursor: not-allowed;
      box-shadow: none;
    }

    /* Result va Copy Qismi */
    .result-group {
      display: flex;
      gap: 10px;
    }

    .url-input {
      flex: 1;
      background-color: #1a1a1a;
      border: 1px solid #333333;
      border-radius: 8px;
      padding: 12px 14px;
      color: #38ef7d;
      font-size: 13px;
      outline: none;
      font-family: monospace;
    }

    .btn-copy {
      background-color: #ff7b00;
      border: none;
      padding: 0 18px;
      border-radius: 8px;
      color: #000000;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s;
      font-size: 14px;
    }

    .btn-copy:hover {
      background-color: #ffa200;
    }

    /* Status text */
    .status-msg {
      font-size: 12px;
      text-align: center;
      color: #888;
    }
  </style>
</head>
<body>

  <div class="main-card">
    <div class="title">Skin URL Generator</div>

    <!-- Upload Box -->
    <div class="upload-zone" id="drop-area" onclick="document.getElementById('file-input').click()">
      <p class="upload-text" id="upload-label">Upload Skin File (.png)</p>
      <canvas id="skin-canvas"></canvas>
      <input type="file" id="file-input" accept="image/png">
    </div>

    <!-- Generate Button -->
    <button class="btn-generate" id="generate-btn">GENERATE URL</button>

    <!-- URL Output -->
    <div class="result-group">
      <input type="text" class="url-input" id="url-output" placeholder="url:" readonly>
      <button class="btn-copy" id="copy-btn">Copy</button>
    </div>

    <div class="status-msg" id="status-text">PNG skin faylingizni tanlang va tugmani bosing</div>
  </div>

  <script>
    const fileInput = document.getElementById('file-input');
    const uploadLabel = document.getElementById('upload-label');
    const skinCanvas = document.getElementById('skin-canvas');
    const generateBtn = document.getElementById('generate-btn');
    const urlOutput = document.getElementById('url-output');
    const copyBtn = document.getElementById('copy-btn');
    const statusText = document.getElementById('status-text');

    let selectedFile = null;
    let skinViewer = null;

    // 3D Skin ko'rish sozlamasi
    function initSkinViewer(imageSrc) {
      uploadLabel.style.display = 'none';
      skinCanvas.style.display = 'block';

      if (!skinViewer) {
        skinViewer = new skinview3d.SkinViewer({
          canvas: skinCanvas,
          width: 150,
          height: 180,
          skin: imageSrc
        });
        skinViewer.animation = new skinview3d.WalkingAnimation();
        skinViewer.animation.speed = 0.6;
      } else {
        skinViewer.loadSkin(imageSrc);
      }
    }

    // Fayl tanlanganda
    fileInput.addEventListener('change', (e) => {
      selectedFile = e.target.files[0];
      if (selectedFile) {
        if (!selectedFile.name.endsWith('.png')) {
          alert("Faqat .png formatidagi Minecraft skin faylini yuklang!");
          return;
        }

        const reader = new FileReader();
        reader.onload = function(event) {
          initSkinViewer(event.target.result);
        };
        reader.readAsDataURL(selectedFile);
        statusText.innerText = "Fayl tanlandi: " + selectedFile.name;
      }
    });

    // Generate tugmasi bosilganda (Bepul tmpfiles.org servisi orqali)
    generateBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        alert("Iltimos, avval skin faylini tanlang!");
        return;
      }

      generateBtn.innerText = "UPLOADING...";
      generateBtn.disabled = true;
      statusText.innerText = "URL havola yaratilmoqda...";

      const formData = new FormData();
      formData.append('file', selectedFile);

      try {
        const response = await fetch('https://tmpfiles.org/api/v1/upload', {
          method: 'POST',
          body: formData
        });

        const data = await response.json();

        if (data.status === 'success') {
          // tmpfiles.org bergan havolani to'g'ridan-to'g'ri fayl havolasiga o'tkazish
          const rawUrl = data.data.url.replace('tmpfiles.org/', 'tmpfiles.org/dl/');
          urlOutput.value = rawUrl;
          statusText.innerText = "Havola tayyor!";
        } else {
          statusText.innerText = "Xatolik yuz berdi, qaytadan urinib ko'ring.";
        }
      } catch (error) {
        statusText.innerText = "Yuklashda xatolik bo'ldi. Internetni tekshiring.";
      } finally {
        generateBtn.innerText = "GENERATE URL";
        generateBtn.disabled = false;
      }
    });

    // Copy tugmasi
    copyBtn.addEventListener('click', () => {
      if (urlOutput.value) {
        navigator.clipboard.writeText(urlOutput.value);
        copyBtn.innerText = "Copied!";
        setTimeout(() => copyBtn.innerText = "Copy", 2000);
      }
    });
  </script>
</body>
</html>
