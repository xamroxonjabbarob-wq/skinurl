<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkinURL - Minecraft Skin Host & 3D Viewer</title>
  
  <!-- CDN Kutubxonalar: 3D Skin Viewer va QR Code -->
  <script src="https://bs-community.github.io/skinview3d/js/skinview3d.bundle.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-color: #0b0f19;
      --card-bg: #151c2c;
      --accent-color: #ff7b00;
      --accent-hover: #ffa200;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: #2a354d;
      --success-color: #10b981;
      --error-color: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 20px 10px;
    }

    header {
      text-align: center;
      margin-bottom: 25px;
    }

    header h1 {
      font-size: 28px;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 5px;
    }

    header p {
      color: var(--text-muted);
      font-size: 14px;
    }

    .main-container {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
    }

    @media (max-width: 768px) {
      .main-container {
        grid-template-columns: 1fr;
      }
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.3);
    }

    /* Drop Zone */
    .upload-box {
      border: 2px dashed var(--accent-color);
      border-radius: 12px;
      background: #0f1523;
      padding: 30px 15px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .upload-box:hover {
      background: #182238;
      border-color: var(--accent-hover);
    }

    .upload-icon {
      font-size: 36px;
    }

    #file-input {
      display: none;
    }

    /* Buttons */
    .btn {
      background: var(--accent-color);
      color: #000;
      border: none;
      padding: 12px 18px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn:hover {
      background: var(--accent-hover);
      transform: translateY(-2px);
    }

    .btn:disabled {
      background: #334155;
      color: #64748b;
      cursor: not-allowed;
      transform: none;
    }

    .btn-secondary {
      background: #2a354d;
      color: var(--text-main);
    }

    .btn-secondary:hover {
      background: #3b4a6b;
    }

    /* Result Box */
    .input-group {
      display: flex;
      gap: 8px;
    }

    .input-field {
      flex: 1;
      background: #0f1523;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 10px 12px;
      color: var(--success-color);
      font-family: monospace;
      font-size: 13px;
      outline: none;
    }

    /* 3D Viewer Box */
    .viewer-card {
      align-items: center;
      justify-content: center;
      position: relative;
    }

    #canvas-container {
      width: 100%;
      height: 260px;
      display: flex;
      justify-content: center;
      align-items: center;
      background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
      border-radius: 12px;
    }

    .viewer-controls {
      display: flex;
      gap: 8px;
      width: 100%;
    }

    .viewer-controls .btn {
      flex: 1;
      font-size: 12px;
      padding: 8px;
    }

    /* QR Code Modal */
    #qrcode {
      display: flex;
      justify-content: center;
      margin-top: 10px;
      padding: 10px;
      background: white;
      border-radius: 8px;
      width: fit-content;
      margin-left: auto;
      margin-right: auto;
    }

    /* History Section */
    .history-card {
      grid-column: 1 / -1;
    }

    .history-list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 150px;
      overflow-y: auto;
    }

    .history-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #0f1523;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 13px;
      border: 1px solid var(--border-color);
    }

    .history-url {
      color: var(--accent-color);
      text-decoration: none;
      word-break: break-all;
      font-family: monospace;
      max-width: 80%;
    }

    .status-badge {
      font-size: 12px;
      text-align: center;
      color: var(--text-muted);
    }
  </style>
</head>
<body>

  <header>
    <h1>SkinURL Generator</h1>
    <p>Minecraft PNG skinlaringiz uchun to'g'ridan-to'g'ri doimiy havola yarating</p>
  </header>

  <div class="main-container">
    
    <!-- Chap Tomon: Upload va Natija -->
    <div class="card">
      <div class="upload-box" id="drop-zone" onclick="document.getElementById('file-input').click()">
        <div class="upload-icon">📁</div>
        <div style="font-weight: 600;" id="file-name-display">Skin faylini tanlang (.png)</div>
        <div style="font-size: 12px; color: var(--text-muted);">Sichqoncha bilan tashlashingiz ham mumkin</div>
        <input type="file" id="file-input" accept="image/png">
      </div>

      <button class="btn" id="generate-btn">
        <span>⚡ GENERATE DIRECT URL</span>
      </button>

      <div class="input-group">
        <input type="text" class="input-field" id="url-output" placeholder="https://files.catbox.moe/..." readonly>
        <button class="btn btn-secondary" id="copy-btn">Nusxa</button>
      </div>

      <div class="status-badge" id="status-text">Fayl kutilmoqda...</div>

      <!-- QR Code paneli -->
      <div id="qrcode-container" style="display: none; text-align: center;">
        <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 5px;">Telefon bilan skaner qilish:</p>
        <div id="qrcode"></div>
      </div>
    </div>

    <!-- O'ng Tomon: 3D Interaktiv Ko'rinish -->
    <div class="card viewer-card">
      <div id="canvas-container">
        <canvas id="skin-canvas"></canvas>
      </div>

      <div class="viewer-controls">
        <button class="btn btn-secondary" id="btn-walk">Walk</button>
        <button class="btn btn-secondary" id="btn-run">Run</button>
        <button class="btn btn-secondary" id="btn-rotate">Aylanish: ON</button>
      </div>
    </div>

    <!-- Pastki Qism: Tarix (History) -->
    <div class="card history-card">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="font-size: 16px; color: var(--text-main);">📜 Oxirgi Yaratilgan Havolalar</h3>
        <button class="btn btn-secondary" id="clear-history-btn" style="padding: 4px 10px; font-size: 12px;">Tozalash</button>
      </div>
      <ul class="history-list" id="history-list">
        <!-- JS orqali to'ldiriladi -->
      </ul>
    </div>

  </div>

  <script>
    // Elementlar
    const fileInput = document.getElementById('file-input');
    const dropZone = document.getElementById('drop-zone');
    const fileNameDisplay = document.getElementById('file-name-display');
    const generateBtn = document.getElementById('generate-btn');
    const urlOutput = document.getElementById('url-output');
    const copyBtn = document.getElementById('copy-btn');
    const statusText = document.getElementById('status-text');
    const qrcodeContainer = document.getElementById('qrcode-container');
    const qrcodeDiv = document.getElementById('qrcode');
    const historyList = document.getElementById('history-list');

    let selectedFile = null;
    let skinViewer = null;
    let autoRotate = true;

    // 1. 3D Skin Viewer Boshqaruvi
    function setup3DViewer(imageSource) {
      if (!skinViewer) {
        skinViewer = new skinview3d.SkinViewer({
          canvas: document.getElementById("skin-canvas"),
          width: 220,
          height: 240,
          skin: imageSource
        });
        skinViewer.animation = new skinview3d.WalkingAnimation();
        skinViewer.animation.speed = 0.6;
        skinViewer.autoRotate = autoRotate;
      } else {
        skinViewer.loadSkin(imageSource);
      }
    }

    // Default Stiv skini
    setup3DViewer("https://bs-community.github.io/skinview3d/img/steve.png");

    // 3D Tugmalar
    document.getElementById('btn-walk').addEventListener('click', () => {
      skinViewer.animation = new skinview3d.WalkingAnimation();
      skinViewer.animation.speed = 0.6;
    });

    document.getElementById('btn-run').addEventListener('click', () => {
      skinViewer.animation = new skinview3d.RunningAnimation();
      skinViewer.animation.speed = 1.2;
    });

    document.getElementById('btn-rotate').addEventListener('click', (e) => {
      autoRotate = !autoRotate;
      skinViewer.autoRotate = autoRotate;
      e.target.innerText = "Aylanish: " + (autoRotate ? "ON" : "OFF");
    });

    // 2. Drag and Drop va Fayl Tanlash
    ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
      dropZone.addEventListener(eventName, (e) => { e.preventDefault(); e.stopPropagation(); }, false);
    });

    dropZone.addEventListener('drop', (e) => {
      const dt = e.dataTransfer;
      const files = dt.files;
      if (files.length > 0) handleFileSelect(files[0]);
    });

    fileInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) handleFileSelect(e.target.files[0]);
    });

    function handleFileSelect(file) {
      if (!file.type.includes('image/png')) {
        alert("Xatolik: Faqat PNG formatidagi fayllarni yuklashingiz mumkin!");
        return;
      }

      // Skin o'lchamini tekshirish
      const img = new Image();
      img.src = URL.createObjectURL(file);
      img.onload = function() {
        if ((this.width === 64 && this.height === 64) || (this.width === 64 && this.height === 32)) {
          selectedFile = file;
          fileNameDisplay.innerText = file.name;
          statusText.style.color = "var(--success-color)";
          statusText.innerText = `Skin tayyor (${this.width}x${this.height})`;
          setup3DViewer(img.src);
        } else {
          alert(`Ogohlantirish: Minecraft standart skin o'lchami 64x64 yoki 64x32 bo'ladi. Tanlangan fayl: ${this.width}x${this.height}`);
          selectedFile = file;
          fileNameDisplay.innerText = file.name;
          setup3DViewer(img.src);
        }
      };
    }

    // 3. Catbox.moe API orqali To'g'ridan-To'g'ri Havola Yaratish
    generateBtn.addEventListener('click', async () => {
      if (!selectedFile) {
        alert("Iltimos, avval skin faylini yuklang!");
        return;
      }

      generateBtn.innerText = "YUKLANMOQDA...";
      generateBtn.disabled = true;
      statusText.innerText = "Serverga yuklanmoqda...";

      const formData = new FormData();
      formData.append('reqtype', 'fileupload');
      formData.append('fileToUpload', selectedFile);

      try {
        const response = await fetch('https://catbox.moe/user/api.php', {
          method: 'POST',
          body: formData
        });

        if (response.ok) {
          const directUrl = await response.text();
          const cleanUrl = directUrl.trim();

          urlOutput.value = cleanUrl;
          statusText.style.color = "var(--success-color)";
          statusText.innerText = "To'g'ridan-to'g'ri link yaratildi!";

          // QR Kod chiqarish
          qrcodeDiv.innerHTML = "";
          new QRCode(qrcodeDiv, { text: cleanUrl, width: 100, height: 100 });
          qrcodeContainer.style.display = "block";

          // Tarixga saqlash
          saveToHistory(selectedFile.name, cleanUrl);
        } else {
          throw new Error("Server xatosi");
        }
      } catch (err) {
        statusText.style.color = "var(--error-color)";
        statusText.innerText = "Yuklashda xatolik yuz berdi. Qayta urining.";
        console.error(err);
      } finally {
        generateBtn.innerText = "⚡ GENERATE DIRECT URL";
        generateBtn.disabled = false;
      }
    });

    // 4. Nusxa olish
    copyBtn.addEventListener('click', () => {
      if (urlOutput.value) {
        navigator.clipboard.writeText(urlOutput.value);
        copyBtn.innerText = "Nusxalandi!";
        setTimeout(() => copyBtn.innerText = "Nusxa", 2000);
      }
    });

    // 5. Tarix (Local Storage)
    function saveToHistory(name, url) {
      let history = JSON.parse(localStorage.getItem('skin_history') || '[]');
      history.unshift({ name, url, date: new Date().toLocaleTimeString() });
      if (history.length > 5) history.pop(); // Oxirgi 5 tasini saqlash
      localStorage.setItem('skin_history', JSON.stringify(history));
      renderHistory();
    }

    function renderHistory() {
      let history = JSON.parse(localStorage.getItem('skin_history') || '[]');
      historyList.innerHTML = "";
      if (history.length === 0) {
        historyList.innerHTML = `<li style="color:var(--text-muted); font-size:12px;">Hali havolalar yo'q.</li>`;
        return;
      }
      history.forEach(item => {
        const li = document.createElement('li');
        li.className = 'history-item';
        li.innerHTML = `
          <a href="${item.url}" target="_blank" class="history-url">${item.url}</a>
          <button class="btn btn-secondary" style="padding:2px 8px; font-size:11px;" onclick="navigator.clipboard.writeText('${item.url}')">Nusxa</button>
        `;
        historyList.appendChild(li);
      });
    }

    document.getElementById('clear-history-btn').addEventListener('click', () => {
      localStorage.removeItem('skin_history');
      renderHistory();
    });

    renderHistory();
  </script>
</body>
</html>
