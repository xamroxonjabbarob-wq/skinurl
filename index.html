<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkinURL - Minecraft Skin to URL</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Arial, sans-serif; }
    body { background-color: #0d1117; color: #c9d1d9; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
    .container { width: 100%; max-width: 380px; display: flex; flex-direction: column; gap: 15px; }
    
    /* Upload zonasi */
    .upload-box { border: 2px dashed #30363d; border-radius: 12px; height: 180px; display: flex; justify-content: center; align-items: center; cursor: pointer; background: #161b22; transition: 0.2s; }
    .upload-box:hover { border-color: #58a6ff; background: #1c2128; }
    .upload-text { font-size: 20px; font-weight: bold; color: #8b949e; text-transform: lowercase; }
    input[type="file"] { display: none; }

    /* Generate Tugmasi */
    .btn-generate { background: #238636; color: #ffffff; border: none; padding: 14px; border-radius: 8px; font-size: 18px; font-weight: bold; cursor: pointer; text-transform: lowercase; transition: 0.2s; }
    .btn-generate:hover { background: #2ea043; }

    /* URL va Copy qismi */
    .result-group { display: flex; gap: 8px; }
    .url-input { flex: 1; background: #161b22; border: 1px solid #30363d; padding: 10px 12px; border-radius: 8px; color: #58a6ff; font-size: 14px; outline: none; }
    .btn-copy { background: #30363d; color: #c9d1d9; border: none; padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: bold; cursor: pointer; text-transform: lowercase; transition: 0.2s; }
    .btn-copy:hover { background: #8b949e; color: #0d1117; }
    
    #status { font-size: 13px; text-align: center; height: 18px; }
  </style>
</head>
<body>

  <div class="container">
    <!-- 1. Upload box -->
    <div class="upload-box" onclick="document.getElementById('fileInput').click()">
      <span class="upload-text" id="uploadLabel">upload</span>
      <input type="file" id="fileInput" accept="image/png" onchange="onFileChosen()">
    </div>

    <!-- Status xabari -->
    <div id="status"></div>

    <!-- 2. Generate button -->
    <button class="btn-generate" onclick="generateUrl()">generate</button>

    <!-- 3. URL va Copy -->
    <div class="result-group">
      <input type="text" class="url-input" id="urlResult" placeholder="url:" readonly>
      <button class="btn-copy" onclick="copyLink()">copy</button>
    </div>
  </div>

  <script>
    function onFileChosen() {
      const input = document.getElementById('fileInput');
      const label = document.getElementById('uploadLabel');
      if (input.files[0]) {
        label.innerText = input.files[0].name;
        label.style.color = '#58a6ff';
      }
    }

    async function generateUrl() {
      const input = document.getElementById('fileInput');
      const status = document.getElementById('status');
      const urlResult = document.getElementById('urlResult');

      if (!input.files[0]) {
        status.innerHTML = '<span style="color: #f85149;">Fayl tanlanmadi!</span>';
        return;
      }

      status.innerHTML = '<span style="color: #e3b341;">Yuklanmoqda...</span>';

      const formData = new FormData();
      formData.append('image', input.files[0]);

      try {
        const response = await fetch('https://api.imgbb.com/1/upload?key=6d207e02198a847aa98d0a2a901485a5', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();

        if (data.success) {
          urlResult.value = data.data.url;
          status.innerHTML = '<span style="color: #3fb950;">Tayyor!</span>';
        } else {
          status.innerHTML = '<span style="color: #f85149;">Xatolik berdi!</span>';
        }
      } catch (e) {
        status.innerHTML = '<span style="color: #f85149;">Serverda xatolik!</span>';
      }
    }

    function copyLink() {
      const urlInput = document.getElementById('urlResult');
      if (urlInput.value && urlInput.value !== 'url:') {
        navigator.clipboard.writeText(urlInput.value);
        alert("URL nusxalandi!");
      }
    }
  </script>

</body>
</html>
