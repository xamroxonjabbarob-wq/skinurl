<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>SkinURL Studio Pro - Ultimate Minecraft Skin Hub</title>
  
  <!-- Google Fonts & FontAwesome Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600;700&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <!-- Skinview3d Library for 3D Minecraft Skin Rendering -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/skinview3d@2.4.0/bundles/skinview3d.bundle.js"></script>
  <!-- QRCode.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <style>
    :root {
      --bg-gradient: linear-gradient(135deg, #090d16 0%, #111827 50%, #080d1a 100%);
      --card-bg: rgba(17, 24, 39, 0.75);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-green: #10b981;
      --accent-green-hover: #059669;
      --accent-blue: #3b82f6;
      --accent-purple: #8b5cf6;
      --text-main: #f9fafb;
      --text-muted: #9ca3af;
      --glass-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
    }

    [data-theme="neon"] {
      --bg-gradient: linear-gradient(135deg, #050515 0%, #120a2a 50%, #030014 100%);
      --card-bg: rgba(20, 10, 40, 0.8);
      --card-border: rgba(236, 72, 153, 0.3);
      --accent-green: #ec4899;
      --accent-green-hover: #db2777;
      --accent-blue: #8b5cf6;
      --text-main: #ffffff;
      --text-muted: #c084fc;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 16px;
      overflow-x: hidden;
    }

    /* Header */
    .app-header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 20px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      margin-bottom: 20px;
      box-shadow: var(--glass-shadow);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, #10b981, #3b82f6);
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 20px;
      color: #fff;
      box-shadow: 0 4px 15px rgba(16, 185, 129, 0.4);
    }

    .brand-title {
      font-size: 20px;
      font-weight: 800;
      letter-spacing: -0.5px;
      background: linear-gradient(90deg, #34d399, #60a5fa);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 8px;
    }

    .btn-icon {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      width: 38px;
      height: 38px;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-icon:hover {
      background: rgba(255, 255, 255, 0.15);
      transform: translateY(-2px);
    }

    /* Layout Grid */
    .main-grid {
      width: 100%;
      max-width: 900px;
      display: grid;
      grid-template-columns: 1fr;
      gap: 20px;
    }

    @media (min-width: 768px) {
      .main-grid {
        grid-template-columns: 1fr 1fr;
      }
    }

    /* Card Panels */
    .panel {
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      box-shadow: var(--glass-shadow);
      display: flex;
      flex-direction: column;
      gap: 16px;
      position: relative;
    }

    .panel-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 1px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* 3D Canvas Box */
    .viewer-container {
      width: 100%;
      height: 280px;
      background: radial-gradient(circle at center, rgba(59, 130, 246, 0.1) 0%, rgba(0,0,0,0.4) 100%);
      border-radius: 16px;
      border: 1px dashed var(--card-border);
      position: relative;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    #skinViewerCanvas {
      width: 100% !important;
      height: 100% !important;
      outline: none;
      cursor: grab;
    }

    #skinViewerCanvas:active {
      cursor: grabbing;
    }

    .viewer-controls {
      position: absolute;
      bottom: 10px;
      left: 10px;
      right: 10px;
      display: flex;
      justify-content: center;
      gap: 8px;
      background: rgba(0, 0, 0, 0.5);
      backdrop-filter: blur(8px);
      padding: 6px;
      border-radius: 12px;
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .ctrl-btn {
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #fff;
      padding: 6px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
    }

    .ctrl-btn.active, .ctrl-btn:hover {
      background: var(--accent-blue);
      box-shadow: 0 0 10px rgba(59, 130, 246, 0.5);
    }

    /* Upload Zone */
    .drop-zone {
      border: 2px dashed rgba(255, 255, 255, 0.2);
      border-radius: 16px;
      padding: 24px 16px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s;
      background: rgba(255, 255, 255, 0.02);
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
    }

    .drop-zone:hover, .drop-zone.dragover {
      border-color: var(--accent-green);
      background: rgba(16, 185, 129, 0.08);
      transform: scale(1.01);
    }

    .drop-icon {
      font-size: 32px;
      color: var(--accent-green);
    }

    .drop-text {
      font-size: 14px;
      font-weight: 600;
      color: var(--text-main);
    }

    .drop-subtext {
      font-size: 12px;
      color: var(--text-muted);
    }

    input[type="file"] {
      display: none;
    }

    /* Action Button */
    .btn-main {
      width: 100%;
      background: linear-gradient(135deg, var(--accent-green), var(--accent-blue));
      color: #ffffff;
      border: none;
      padding: 14px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      box-shadow: 0 8px 20px rgba(16, 185, 129, 0.3);
      transition: all 0.25s;
    }

    .btn-main:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(16, 185, 129, 0.5);
    }

    .btn-main:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }

    /* Result Inputs */
    .input-group {
      display: flex;
      gap: 8px;
    }

    .custom-input {
      flex: 1;
      background: rgba(0, 0, 0, 0.3);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 10px 14px;
      color: var(--accent-green);
      font-family: 'Fira Code', monospace;
      font-size: 13px;
      outline: none;
    }

    .btn-copy {
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid var(--card-border);
      color: #fff;
      padding: 0 16px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .btn-copy:hover {
      background: var(--accent-green);
      color: #000;
    }

    /* Status Bar */
    .status-badge {
      font-size: 12px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: 8px;
      text-align: center;
      display: none;
    }

    .status-loading {
      display: block;
      background: rgba(245, 158, 11, 0.15);
      color: #fbbf24;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    .status-success {
      display: block;
      background: rgba(16, 185, 129, 0.15);
      color: #34d399;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }

    .status-error {
      display: block;
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }

    /* Avatar & Palette Box */
    .avatar-preview-box {
      display: flex;
      align-items: center;
      gap: 16px;
      background: rgba(0, 0, 0, 0.2);
      padding: 12px;
      border-radius: 12px;
      border: 1px solid var(--card-border);
    }

    .avatar-canvas {
      width: 64px;
      height: 64px;
      border-radius: 10px;
      image-rendering: pixelated;
      background: #222;
      border: 2px solid var(--card-border);
    }

    .palette-list {
      display: flex;
      gap: 6px;
      margin-top: 6px;
    }

    .palette-color {
      width: 22px;
      height: 22px;
      border-radius: 6px;
      border: 1px solid rgba(255,255,255,0.2);
      cursor: pointer;
      transition: transform 0.2s;
    }

    .palette-color:hover {
      transform: scale(1.2);
    }

    /* History Grid */
    .history-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 200px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .history-list::-webkit-scrollbar {
      width: 4px;
    }
    .history-list::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.2);
      border-radius: 4px;
    }

    .history-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.25);
      padding: 8px 12px;
      border-radius: 10px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 12px;
    }

    .history-url {
      color: var(--accent-blue);
      text-decoration: none;
      font-family: 'Fira Code', monospace;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 200px;
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: var(--text-main);
      color: #000;
      padding: 12px 24px;
      border-radius: 30px;
      font-size: 14px;
      font-weight: 700;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
      opacity: 0;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      z-index: 9999;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    /* QR Code Modal */
    .modal-overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.8);
      backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 10000;
    }

    .modal-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 24px;
      text-align: center;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      box-shadow: var(--glass-shadow);
    }

    #qrcode img {
      margin: 0 auto;
      border-radius: 12px;
      padding: 10px;
      background: #fff;
    }
  </style>
</head>
<body>

  <!-- Top Header -->
  <header class="app-header">
    <div class="brand">
      <div class="brand-icon"><i class="fa-solid fa-cube"></i></div>
      <div>
        <div class="brand-title">SkinURL Studio</div>
        <div style="font-size: 10px; color: var(--text-muted);">Minecraft Skin Engine</div>
      </div>
    </div>
    <div class="header-actions">
      <button class="btn-icon" onclick="toggleTheme()" title="Rejimni o'zgartirish"><i class="fa-solid fa-palette"></i></button>
      <button class="btn-icon" onclick="clearHistory()" title="Tarixni tozalash"><i class="fa-solid fa-trash-can"></i></button>
    </div>
  </header>

  <!-- Main Grid -->
  <main class="main-grid">

    <!-- Panel 1: 3D Viewer & Controls -->
    <section class="panel">
      <div class="panel-title"><i class="fa-solid fa-vr-cardboard"></i> 3D Skin Ko'rinishi</div>
      
      <div class="viewer-container">
        <canvas id="skinViewerCanvas"></canvas>
        <div class="viewer-controls">
          <button class="ctrl-btn active" id="btnAnimWalk" onclick="toggleAnimation('walk')"><i class="fa-solid fa-person-walking"></i> Yurish</button>
          <button class="ctrl-btn" id="btnAnimRun" onclick="toggleAnimation('run')"><i class="fa-solid fa-person-running"></i> Yugurish</button>
          <button class="ctrl-btn" onclick="toggleRotate()"><i class="fa-solid fa-rotate"></i> Aylanma</button>
        </div>
      </div>

      <!-- Avatar Head Crop & Palette -->
      <div class="avatar-preview-box">
        <canvas id="headCanvas" class="avatar-canvas" width="64" height="64" title="2D Skin Boshi"></canvas>
        <div style="flex: 1;">
          <div style="font-size: 12px; font-weight: 700;">Skin Palitrasi</div>
          <div class="palette-list" id="paletteBox">
            <div class="palette-color" style="background:#222;"></div>
            <div class="palette-color" style="background:#555;"></div>
            <div class="palette-color" style="background:#888;"></div>
            <div class="palette-color" style="background:#aaa;"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- Panel 2: Upload & Multi-Host URL Generator -->
    <section class="panel">
      <div class="panel-title"><i class="fa-solid fa-cloud-arrow-up"></i> Skin Yuklash va Link Olish</div>

      <div class="drop-zone" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <i class="fa-solid fa-file-image drop-icon"></i>
        <div class="drop-text" id="dropLabel">Minecraft skin `.png` rasmini tanlang</div>
        <div class="drop-subtext">yoki shu yerga sudrab tashlang (Drag & Drop)</div>
        <input type="file" id="fileInput" accept="image/png" onchange="handleFileSelect(this.files[0])">
      </div>

      <div id="statusBadge" class="status-badge"></div>

      <button class="btn-main" id="btnGenerate" onclick="startMultiHostUpload()">
        <i class="fa-solid fa-bolt"></i> URL Havola Yaratish
      </button>

      <div class="input-group">
        <input type="text" class="custom-input" id="urlOutput" placeholder="https://..." readonly>
        <button class="btn-copy" onclick="copyMainUrl()"><i class="fa-regular fa-copy"></i> Copy</button>
        <button class="btn-icon" onclick="openQrModal()" title="QR Kod"><i class="fa-solid fa-qrcode"></i></button>
      </div>

      <!-- History -->
      <div style="margin-top: 10px;">
        <div class="panel-title" style="font-size: 12px; margin-bottom: 8px;"><i class="fa-solid fa-clock-rotate-left"></i> Oxirgi Yuklanganlar</div>
        <div class="history-list" id="historyContainer">
          <div style="font-size: 12px; color: var(--text-muted); text-align: center; padding: 10px;">Hali hech narsa yuklanmadi</div>
        </div>
      </div>
    </section>

  </main>

  <!-- Modal for QR Code -->
  <div class="modal-overlay" id="qrModal" onclick="closeQrModal()">
    <div class="modal-box" onclick="event.stopPropagation()">
      <div style="font-size: 18px; font-weight: 800;">Skin URL QR Kodu</div>
      <div id="qrcode"></div>
      <button class="btn-copy" onclick="closeQrModal()"><i class="fa-solid fa-xmark"></i> Yopish</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toastBox"><i class="fa-solid fa-circle-check" style="color: #10b981;"></i> <span id="toastMsg">Nusxalandi!</span></div>

  <script>
    let skinViewer = null;
    let walkAnimation = null;
    let runAnimation = null;
    let isRotating = true;
    let currentSkinFile = null;
    let currentSkinDataUrl = null;

    window.addEventListener('DOMContentLoaded', () => {
      initSkinViewer();
      loadHistory();
      
      const zone = document.getElementById('dropZone');
      ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(evt => {
        zone.addEventListener(evt, e => e.preventDefault());
      });
      zone.addEventListener('dragover', () => zone.classList.add('dragover'));
      zone.addEventListener('dragleave', () => zone.classList.remove('dragover'));
      zone.addEventListener('drop', (e) => {
        zone.classList.remove('dragover');
        if (e.dataTransfer.files && e.dataTransfer.files[0]) {
          document.getElementById('fileInput').files = e.dataTransfer.files;
          handleFileSelect(e.dataTransfer.files[0]);
        }
      });
    });

    function initSkinViewer() {
      const canvas = document.getElementById('skinViewerCanvas');
      try {
        skinViewer = new skinview3d.SkinViewer({
          canvas: canvas,
          width: canvas.clientWidth || 300,
          height: canvas.clientHeight || 280,
          skin: "https://textures.minecraft.net/texture/38f73a3809cbcf83e95088ce61d76b15809fa8a4f9a562477f1b72a8d3e911c"
        });

        skinViewer.camera.position.set(0, 10, 50);
        skinViewer.zoom = 0.9;
        skinViewer.autoRotate = true;
        skinViewer.autoRotateSpeed = 0.6;

        walkAnimation = skinViewer.animations.add(skinview3d.WalkingAnimation);
        walkAnimation.speed = 0.6;
      } catch (err) {
        console.error("3D Canvas error:", err);
      }
    }

    function toggleAnimation(type) {
      if (!skinViewer) return;
      skinViewer.animations.paused = false;
      document.getElementById('btnAnimWalk').classList.remove('active');
      document.getElementById('btnAnimRun').classList.remove('active');

      if (type === 'walk') {
        if (runAnimation) runAnimation.remove();
        walkAnimation = skinViewer.animations.add(skinview3d.WalkingAnimation);
        walkAnimation.speed = 0.6;
        document.getElementById('btnAnimWalk').classList.add('active');
      } else if (type === 'run') {
        if (walkAnimation) walkAnimation.remove();
        runAnimation = skinViewer.animations.add(skinview3d.RunningAnimation);
        runAnimation.speed = 0.8;
        document.getElementById('btnAnimRun').classList.add('active');
      }
    }

    function toggleRotate() {
      if (!skinViewer) return;
      isRotating = !isRotating;
      skinViewer.autoRotate = isRotating;
    }

    function handleFileSelect(file) {
      if (!file) return;
      if (!file.type.includes('image')) {
        showStatus('Faqat PNG rasm yuklashingiz mumkin!', 'error');
        return;
      }

      currentSkinFile = file;
      document.getElementById('dropLabel').innerText = file.name;

      const reader = new FileReader();
      reader.onload = (e) => {
        currentSkinDataUrl = e.target.result;
        
        if (skinViewer) {
          skinViewer.loadSkin(currentSkinDataUrl);
        }

        render2DHead(currentSkinDataUrl);
        extractPalette(currentSkinDataUrl);
      };
      reader.readAsDataURL(file);
    }

    function render2DHead(dataUrl) {
      const img = new Image();
      img.onload = () => {
        const canvas = document.getElementById('headCanvas');
        const ctx = canvas.getContext('2d');
        ctx.imageSmoothingEnabled = false;
        ctx.clearRect(0, 0, 64, 64);

        ctx.drawImage(img, 8, 8, 8, 8, 0, 0, 64, 64);
        ctx.drawImage(img, 40, 8, 8, 8, 0, 0, 64, 64);
      };
      img.src = dataUrl;
    }

    function extractPalette(dataUrl) {
      const img = new Image();
      img.onload = () => {
        const cvs = document.createElement('canvas');
        const ctx = cvs.getContext('2d');
        cvs.width = img.width;
        cvs.height = img.height;
        ctx.drawImage(img, 0, 0);

        const imgData = ctx.getImageData(0, 0, img.width, img.height).data;
        const colors = [];

        for (let i = 0; i < imgData.length; i += 64) {
          const alpha = imgData[i + 3];
          if (alpha > 200) {
            const r = imgData[i];
            const g = imgData[i + 1];
            const b = imgData[i + 2];
            const hex = "#" + ((1 << 24) + (r << 16) + (g << 8) + b).toString(16).slice(1);
            if (!colors.includes(hex)) colors.push(hex);
          }
          if (colors.length >= 4) break;
        }

        const box = document.getElementById('paletteBox');
        box.innerHTML = '';
        colors.forEach(hex => {
          const d = document.createElement('div');
          d.className = 'palette-color';
          d.style.background = hex;
          d.title = hex;
          d.onclick = () => {
            navigator.clipboard.writeText(hex);
            showToast("Rang nusxalandi: " + hex);
          };
          box.appendChild(d);
        });
      };
      img.src = dataUrl;
    }

    async function startMultiHostUpload() {
      if (!currentSkinFile) {
        showStatus('Iltimos, avval skin faylini tanlang!', 'error');
        return;
      }

      const btn = document.getElementById('btnGenerate');
      btn.disabled = true;
      showStatus('Yuklanmoqda... (1-server: Tmpfiles)', 'loading');

      let finalUrl = await uploadToTmpfiles(currentSkinFile);

      if (!finalUrl) {
        showStatus('2-serverga urinilmoqda (Catbox)...', 'loading');
        finalUrl = await uploadToCatbox(currentSkinFile);
      }

      if (!finalUrl) {
        showStatus('3-serverga urinilmoqda (FreeImage)...', 'loading');
        finalUrl = await uploadToFreeImage(currentSkinFile);
      }

      btn.disabled = false;

      if (finalUrl) {
        document.getElementById('urlOutput').value = finalUrl;
        showStatus('Muvaffaqiyatli yuklandi!', 'success');
        saveToHistory(finalUrl);
        showToast("Skin URL tayyor bo'ldi!");
      } else {
        showStatus('Barcha serverlarda xatolik berdi. Internetni tekshiring!', 'error');
      }
    }

    async function uploadToTmpfiles(file) {
      try {
        const formData = new FormData();
        formData.append('file', file);
        const res = await fetch('https://tmpfiles.org/api/v1/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (data.status === 'success' && data.data && data.data.url) {
          return data.data.url.replace('tmpfiles.org/', 'tmpfiles.org/dl/');
        }
      } catch (e) {
        console.warn("Tmpfiles failed:", e);
      }
      return null;
    }

    async function uploadToCatbox(file) {
      try {
        const formData = new FormData();
        formData.append('reqtype', 'fileupload');
        formData.append('fileToUpload', file);
        const res = await fetch('https://catbox.moe/user/api.php', {
          method: 'POST',
          body: formData
        });
        if (res.ok) {
          const txt = await res.text();
          if (txt.startsWith('http')) return txt.trim();
        }
      } catch (e) {
        console.warn("Catbox failed:", e);
      }
      return null;
    }

    async function uploadToFreeImage(file) {
      try {
        const formData = new FormData();
        formData.append('key', '6d207e02198a847aa98d0a2a901485a5');
        formData.append('action', 'upload');
        formData.append('source', file);
        formData.append('format', 'json');

        const res = await fetch('https://freeimage.host/api/1/upload', {
          method: 'POST',
          body: formData
        });
        const data = await res.json();
        if (data.image && data.image.url) {
          return data.image.url;
        }
      } catch (e) {
        console.warn("FreeImage failed:", e);
      }
      return null;
    }

    function showStatus(text, type) {
      const badge = document.getElementById('statusBadge');
      badge.className = 'status-badge status-' + type;
      badge.innerText = text;
    }

    function showToast(msg) {
      const t = document.getElementById('toastBox');
      document.getElementById('toastMsg').innerText = msg;
      t.classList.add('show');
      setTimeout(() => t.classList.remove('show'), 2500);
    }

    function copyMainUrl() {
      const val = document.getElementById('urlOutput').value;
      if (val) {
        navigator.clipboard.writeText(val);
        showToast("URL nusxalandi!");
      }
    }

    function saveToHistory(url) {
      let h = JSON.parse(localStorage.getItem('skin_history_v2') || '[]');
      h.unshift({ url, time: new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}) });
      if (h.length > 5) h.pop();
      localStorage.setItem('skin_history_v2', JSON.stringify(h));
      loadHistory();
    }

    function loadHistory() {
      let h = JSON.parse(localStorage.getItem('skin_history_v2') || '[]');
      const box = document.getElementById('historyContainer');
      if (h.length === 0) {
        box.innerHTML = '<div style="font-size: 12px; color: var(--text-muted); text-align: center; padding: 10px;">Hali hech narsa yuklanmadi</div>';
        return;
      }
      box.innerHTML = '';
      h.forEach(item => {
        const div = document.createElement('div');
        div.className = 'history-item';
        div.innerHTML = `
          <a href="${item.url}" target="_blank" class="history-url">${item.url}</a>
          <button class="btn-copy" style="padding: 4px 8px; font-size: 11px;" onclick="copyCustom('${item.url}')"><i class="fa-regular fa-copy"></i></button>
        `;
        box.appendChild(div);
      });
    }

    function copyCustom(url) {
      navigator.clipboard.writeText(url);
      showToast("URL nusxalandi!");
    }

    function clearHistory() {
      localStorage.removeItem('skin_history_v2');
      loadHistory();
      showToast("Tarix tozalandi!");
    }

    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      if (current === 'neon') {
        document.body.removeAttribute('data-theme');
      } else {
        document.body.setAttribute('data-theme', 'neon');
      }
    }

    function openQrModal() {
      const val = document.getElementById('urlOutput').value;
      if (!val) {
        showStatus("Avval skin URL hosil qiling!", "error");
        return;
      }
      const box = document.getElementById('qrcode');
      box.innerHTML = '';
      new QRCode(box, {
        text: val,
        width: 160,
        height: 160
      });
      document.getElementById('qrModal').style.display = 'flex';
    }

    function closeQrModal() {
      document.getElementById('qrModal').style.display = 'none';
    }
  </script>
</body>
</html>
