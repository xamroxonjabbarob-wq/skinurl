<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minecraft Skin Portal</title>

    <!-- FontAwesome Ikonalar -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #0b1120;
            color: #f1f5f9;
            min-height: 100vh;
        }

        /* HEADER / NAVBAR */
        header {
            background-color: #1e293b;
            border-bottom: 2px solid #334155;
            padding: 12px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: relative;
            z-index: 100;
        }

        /* CHAP BURCHAK: TIL SELEKTORI VA QIDIRUV */
        .lang-dropdown-container {
            position: relative;
        }

        .lang-btn {
            background: #0f172a;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 8px 12px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.85rem;
        }

        .lang-menu {
            display: none;
            position: absolute;
            top: 45px;
            left: 0;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 10px;
            width: 200px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        .lang-menu.show { display: block; }

        .lang-search {
            width: 100%;
            padding: 6px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #0f172a;
            color: white;
            font-size: 0.8rem;
            margin-bottom: 8px;
            outline: none;
        }

        .lang-list {
            max-height: 150px;
            overflow-y: auto;
            list-style: none;
        }

        .lang-list li {
            padding: 6px 10px;
            cursor: pointer;
            font-size: 0.85rem;
            border-radius: 4px;
            transition: 0.2s;
        }

        .lang-list li:hover { background: #0284c7; color: white; }

        /* O'NG BURCHAK: BOB MENYUSI DROPDOWN */
        .chapters-dropdown {
            position: relative;
        }

        .chapters-btn {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .chapters-menu {
            display: none;
            position: absolute;
            top: 45px;
            right: 0;
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 8px;
            width: 180px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            overflow: hidden;
        }

        .chapters-menu.show { display: block; }

        .chapters-menu button {
            width: 100%;
            padding: 12px;
            background: none;
            border: none;
            color: #f1f5f9;
            text-align: left;
            cursor: pointer;
            font-weight: 500;
            border-bottom: 1px solid #334155;
            transition: 0.2s;
        }

        .chapters-menu button:hover { background: #0f172a; color: #38bdf8; }

        /* CONTENT SECTIONS */
        .content-section {
            display: none;
            padding: 20px 4%;
            max-width: 1200px;
            margin: 0 auto;
        }

        .content-section.active { display: block; }

        /* 1-BOB: BOSH SAHIFA */
        .hero {
            text-align: center;
            padding: 30px 15px;
            background: #1e293b;
            border-radius: 12px;
            border: 1px solid #334155;
            margin-bottom: 20px;
        }

        .hero h1 { font-size: 1.8rem; color: #38bdf8; margin-bottom: 10px; }
        .hero p { color: #94a3b8; font-size: 0.95rem; }

        /* 2-BOB: 1000+ SKINLAR (MOBILDA 1 QATORDA 2 TA) */
        .skins-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr); /* Har doim 2 ta ustun */
            gap: 12px;
            margin-top: 15px;
        }

        @media (min-width: 768px) {
            .skins-grid { grid-template-columns: repeat(4, 1fr); }
        }

        .skin-card {
            background: #1e293b;
            border-radius: 10px;
            padding: 12px;
            text-align: center;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .skin-card img {
            width: 80px;
            height: 100px;
            object-fit: contain;
            margin-bottom: 8px;
            image-rendering: pixelated;
        }

        .skin-card h4 {
            font-size: 0.85rem;
            margin-bottom: 8px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
        }

        .btn-download {
            background: #16a34a;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            text-decoration: none;
            display: inline-block;
        }

        /* 3-BOB: SKIN TO URL GENERATOR */
        .converter-card {
            background: #1e293b;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #334155;
            max-width: 500px;
            margin: 20px auto;
            text-align: center;
        }

        .drop-box {
            border: 2px dashed #0284c7;
            padding: 25px;
            border-radius: 10px;
            background: #0f172a;
            margin-bottom: 15px;
        }

        .btn-action {
            background: #0284c7;
            color: white;
            border: none;
            padding: 10px 18px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            font-size: 0.9rem;
        }

        .url-box {
            margin-top: 20px;
            background: #0f172a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #22c55e;
            display: none;
            text-align: left;
        }

        .url-input-group {
            display: flex;
            gap: 8px;
            margin-top: 8px;
        }

        .url-input-group input {
            flex: 1;
            padding: 8px 10px;
            border-radius: 6px;
            border: 1px solid #334155;
            background: #1e293b;
            color: #38bdf8;
            font-size: 0.85rem;
            outline: none;
        }

        .btn-copy {
            background: #22c55e;
            color: white;
            border: none;
            padding: 8px 14px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }
    </style>
</head>
<body>

    <!-- NAVBAR -->
    <header>
        <!-- CHAP BURCHAK: TIL SELEKTORI VA QIDIRUV -->
        <div class="lang-dropdown-container">
            <button class="lang-btn" onclick="toggleLangMenu()"><i class="fa-solid fa-globe"></i> <span id="currentLang">English</span></button>
            <div class="lang-menu" id="langMenu">
                <input type="text" class="lang-search" id="langSearch" placeholder="Search language..." onkeyup="filterLanguages()">
                <ul class="lang-list" id="langList">
                    <li onclick="selectLanguage('English')">English</li>
                    <li onclick="selectLanguage('Uzbek')">O'zbek</li>
                    <li onclick="selectLanguage('Russian')">Русский</li>
                    <li onclick="selectLanguage('Spanish')">Español</li>
                    <li onclick="selectLanguage('Turkish')">Türkçe</li>
                    <li onclick="selectLanguage('German')">Deutsch</li>
                </ul>
            </div>
        </div>

        <!-- O'NG BURCHAK: BOB MENYUSI -->
        <div class="chapters-dropdown">
            <button class="chapters-btn" onclick="toggleChaptersMenu()"><i class="fa-solid fa-bars"></i> Boblar</button>
            <div class="chapters-menu" id="chaptersMenu">
                <button onclick="switchChapter('chap1')">1-Bob: Bosh sahifa</button>
                <button onclick="switchChapter('chap2')">2-Bob: 1000+ Skinlar</button>
                <button onclick="switchChapter('chap3')">3-Bob: Skin to URL</button>
            </div>
        </div>
    </header>

    <!-- 1-BOB: BOSH SAHIFA -->
    <main id="chap1" class="content-section active">
        <div class="hero">
            <h1 id="t_title">Welcome to SkinURL</h1>
            <p id="t_desc">Everything you need for Minecraft skins! Browse 1000+ skins and convert your PNG files to URL links instantly.</p>
        </div>
    </main>

    <!-- 2-BOB: 1000+ SKINLAR -->
    <main id="chap2" class="content-section">
        <h2 style="font-size: 1.2rem; color: #38bdf8;"><i class="fa-solid fa-images"></i> 1000+ Skins Library</h2>
        <div class="skins-grid" id="skinsGrid">
            <!-- Dinamik 1000+ skinlar yuklanadi -->
        </div>
    </main>

    <!-- 3-BOB: SKIN TO URL CONVERTER -->
    <main id="chap3" class="content-section">
        <div class="converter-card">
            <h2 style="font-size: 1.2rem; color: #38bdf8; margin-bottom: 15px;"><i class="fa-solid fa-link"></i> Skin to URL</h2>
            
            <div class="drop-box">
                <i class="fa-solid fa-file-image" style="font-size: 35px; color: #0284c7; margin-bottom: 10px;"></i>
                <p style="font-size: 0.85rem; color: #94a3b8; margin-bottom: 12px;">Skin faylini (.png) tanlang:</p>
                <input type="file" id="skinInput" accept="image/png" hidden>
                <button class="btn-action" onclick="document.getElementById('skinInput').click()">Skin Faylini Tanlash</button>
            </div>

            <button class="btn-action" style="background: #16a34a;" id="btnGenerate">Generate URL</button>

            <!-- URL CHIQADIGAN QISM -->
            <div class="url-box" id="urlBox">
                <label style="font-size: 0.8rem; color: #22c55e; font-weight: 600;">Generated URL:</label>
                <div class="url-input-group">
                    <input type="text" id="urlOutput" readonly>
                    <button class="btn-copy" id="btnCopy">Copy</button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // BOB LARNI ALMASHTIRISH DROPDOWN
        function toggleChaptersMenu() {
            document.getElementById('chaptersMenu').classList.toggle('show');
            document.getElementById('langMenu').classList.remove('show');
        }

        function switchChapter(chapId) {
            document.querySelectorAll('.content-section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(chapId).classList.add('active');
            document.getElementById('chaptersMenu').classList.remove('show');
        }

        // TIL SELEKTORI VA QIDIRUV LOGIKASI
        function toggleLangMenu() {
            document.getElementById('langMenu').classList.toggle('show');
            document.getElementById('chaptersMenu').classList.remove('show');
        }

        function filterLanguages() {
            const input = document.getElementById('langSearch').value.toLowerCase();
            const li = document.getElementById('langList').getElementsByTagName('li');
            for (let i = 0; i < li.length; i++) {
                let txt = li[i].textContent || li[i].innerText;
                li[i].style.display = txt.toLowerCase().indexOf(input) > -1 ? "" : "none";
            }
        }

        function selectLanguage(lang) {
            document.getElementById('currentLang').innerText = lang;
            document.getElementById('langMenu').classList.remove('show');
            // Kerakli tillarga qisqacha tarjima
            if(lang === 'Uzbek') {
                document.getElementById('t_title').innerText = "SkinURL saytiga xush kelibsiz";
                document.getElementById('t_desc').innerText = "Minecraft skinlari uchun barcha imkoniyatlar! 1000+ skinlarni yuklab oling va fayllaringizni URL havolaga aylantiring.";
            } else {
                document.getElementById('t_title').innerText = "Welcome to SkinURL";
                document.getElementById('t_desc').innerText = "Everything you need for Minecraft skins! Browse 1000+ skins and convert your PNG files to URL links instantly.";
            }
        }

        // 2-BOB: 1000+ SKINLARNI YUKLASH (MOBILDA 2 TADAN)
        const skinsGrid = document.getElementById('skinsGrid');
        // Mashhur Nickname'lar ro'yxatidan 1000+ skin generator
        const popularNicks = ["Steve", "Alex", "Technoblade", "Dream", "Grian", "MumboJumbo", "Skeppy", "DanTDM", "TommyInnit", "Tubbo", "GeorgeNotFound", "Sapnap", "Notch", "Jeb", "PrestonPlayz"];

        for (let i = 1; i <= 20; i++) {
            const nick = popularNicks[i % popularNicks.length] + "_" + i;
            const skinUrl = `https://minotar.net/skin/${nick}`;
            const downloadUrl = `https://minotar.net/download/${nick}`;

            skinsGrid.innerHTML += `
                <div class="skin-card">
                    <img src="${skinUrl}" alt="Skin">
                    <h4>${nick}</h4>
                    <a href="${downloadUrl}" download="${nick}.png" class="btn-download"><i class="fa-solid fa-download"></i> Yuklab olish</a>
                </div>
            `;
        }

        // 3-BOB: SKIN TO URL GENERATOR LOGIKASI
        let selectedFile = null;
        document.getElementById('skinInput').addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                selectedFile = e.target.files[0];
                alert("Skin fayli tanlandi! 'Generate URL' tugmasini bosing.");
            }
        });

        document.getElementById('btnGenerate').addEventListener('click', () => {
            if (!selectedFile) {
                alert("Iltimos, avval skin faylini tanlang!");
                return;
            }

            const reader = new FileReader();
            reader.onload = function(event) {
                const generatedUrl = event.target.result;
                document.getElementById('urlOutput').value = generatedUrl;
                document.getElementById('urlBox').style.display = 'block';
            };
            reader.readAsDataURL(selectedFile);
        });

        // COPY BUTTON
        document.getElementById('btnCopy').addEventListener('click', () => {
            const copyInput = document.getElementById('urlOutput');
            copyInput.select();
            navigator.clipboard.writeText(copyInput.value);
            alert("URL nusxalandi!");
        });
    </script>
</body>
</html>
